<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz · Tecnologia da Informação</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖥️</text></svg>">
<style>
  :root {
    --bg: #eef1f6;
    --card: #ffffff;
    --text: #1c2333;
    --muted: #5b6472;
    --border: #d7dce4;
    --accent: #3454d1;
    --accent-2: #7c5cff;
    --easy: #1f9d55;
    --med: #d68910;
    --hard: #d1453b;
    --correct-bg: #e4f7ec;
    --correct-border: #1f9d55;
    --wrong-bg: #fdeceb;
    --wrong-border: #d1453b;
    --chip-bg: #eef0ff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #14161f;
      --card: #1d2030;
      --text: #eef0f6;
      --muted: #a3aabb;
      --border: #33384a;
      --accent: #7c93ff;
      --accent-2: #a78bfa;
      --correct-bg: #123a26;
      --correct-border: #2fbf71;
      --wrong-bg: #3a1616;
      --wrong-border: #ef5b52;
      --chip-bg: #262b45;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161f;
    --card: #1d2030;
    --text: #eef0f6;
    --muted: #a3aabb;
    --border: #33384a;
    --accent: #7c93ff;
    --accent-2: #a78bfa;
    --correct-bg: #123a26;
    --correct-border: #2fbf71;
    --wrong-bg: #3a1616;
    --wrong-border: #ef5b52;
    --chip-bg: #262b45;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 14px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .wrap { width: 100%; max-width: 720px; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 1.5rem; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0; font-size: 0.92rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 4px 18px rgba(20,25,40,0.06);
    margin-bottom: 16px;
  }

  .section-title { font-weight: 700; margin: 0 0 10px; font-size: 1.02rem; }

  .btn-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .opt-btn {
    flex: 1 1 auto;
    min-width: 80px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 0.92rem;
    cursor: pointer;
    transition: all .15s ease;
  }
  .opt-btn:hover { border-color: var(--accent); }
  .opt-btn.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    font-weight: 600;
  }

  .primary-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .secondary-btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }

  .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.85rem; color: var(--muted); }
  .progress-bar { height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 18px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s ease; }

  .diff-chip {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--chip-bg);
    margin-bottom: 10px;
    letter-spacing: .3px;
    text-transform: uppercase;
  }
  .diff-facil { color: var(--easy); }
  .diff-medio { color: var(--med); }
  .diff-dificil { color: var(--hard); }

  .question-text { font-size: 1.08rem; font-weight: 600; margin: 0 0 16px; line-height: 1.4; }

  .answer-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 13px 15px;
    margin-bottom: 10px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 0.95rem;
    cursor: pointer;
    transition: all .15s ease;
  }
  .answer-btn:hover:not(:disabled) { border-color: var(--accent); }
  .answer-btn:disabled { cursor: default; }
  .answer-btn.correct { background: var(--correct-bg); border-color: var(--correct-border); font-weight: 600; }
  .answer-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); font-weight: 600; }

  .feedback-box {
    margin-top: 14px;
    padding: 14px;
    border-radius: 12px;
    font-size: 0.9rem;
    line-height: 1.45;
  }
  .feedback-box.ok { background: var(--correct-bg); border: 1px solid var(--correct-border); }
  .feedback-box.no { background: var(--wrong-bg); border: 1px solid var(--wrong-border); }
  .feedback-title { font-weight: 700; margin-bottom: 4px; }

  .score-hero { text-align: center; padding: 10px 0 6px; }
  .score-hero .big { font-size: 2.6rem; font-weight: 800; margin: 6px 0 0; }
  .score-hero .sub { color: var(--muted); font-size: 0.95rem; }

  .review-item { border-top: 1px solid var(--border); padding: 14px 0; }
  .review-item:first-child { border-top: none; }
  .review-q { font-weight: 600; margin-bottom: 6px; }
  .review-line { font-size: 0.88rem; margin: 2px 0; }
  .tag-ok { color: var(--easy); font-weight: 700; }
  .tag-no { color: var(--hard); font-weight: 700; }

  footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 10px; }
  .hidden { display: none !important; }

  @media (max-width: 420px) {
    .card { padding: 16px; }
    header h1 { font-size: 1.28rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🖥️ Quiz · Tecnologia da Informação</h1>
    <p>Aula 1 (Tecnologias Logísticas) · Aula 3 (Ecossistemas de TI) · Aula 4 (Excel)</p>
  </header>

  <!-- TELA DE CONFIGURAÇÃO -->
  <div id="setup-screen" class="card">
    <p class="section-title">Dificuldade</p>
    <div class="btn-grid" id="diff-options">
      <button class="opt-btn selected" data-diff="todas">Todas</button>
      <button class="opt-btn" data-diff="facil">Fácil</button>
      <button class="opt-btn" data-diff="medio">Médio</button>
      <button class="opt-btn" data-diff="dificil">Difícil</button>
    </div>

    <p class="section-title">Quantidade de questões</p>
    <div class="btn-grid" id="qty-options">
      <button class="opt-btn" data-qty="10">10</button>
      <button class="opt-btn selected" data-qty="15">15</button>
      <button class="opt-btn" data-qty="20">20</button>
      <button class="opt-btn" data-qty="9999">Todas</button>
    </div>

    <p id="pool-info" style="color:var(--muted); font-size:0.85rem; margin-top:-4px;"></p>

    <button class="primary-btn" id="start-btn">Começar quiz 🚀</button>
  </div>

  <!-- TELA DO QUIZ -->
  <div id="quiz-screen" class="card hidden">
    <div class="progress-row">
      <span id="progress-text">Questão 1 de 15</span>
      <span id="score-text">Acertos: 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

    <div id="diff-chip" class="diff-chip diff-facil">fácil</div>
    <p class="question-text" id="question-text"></p>
    <div id="answers-container"></div>

    <div id="feedback-box" class="feedback-box hidden"></div>

    <button class="primary-btn hidden" id="next-btn">Próxima pergunta →</button>
  </div>

  <!-- TELA DE RESULTADO -->
  <div id="result-screen" class="card hidden">
    <div class="score-hero">
      <p class="sub">Você acertou</p>
      <p class="big" id="final-score">0/0</p>
      <p class="sub" id="final-pct">0%</p>
    </div>
    <button class="primary-btn" id="retry-btn">Jogar de novo (questões novas) 🔁</button>
    <button class="secondary-btn" id="review-toggle">Ver revisão das questões erradas</button>
    <div id="review-list" class="hidden" style="margin-top:14px;"></div>
  </div>

  <footer>Baseado 100% no material das Aulas 1, 3 e 4 de Tecnologia da Informação. Bons estudos! 📚</footer>
</div>

<script>
// ===================== BANCO DE QUESTÕES =====================
const QUESTIONS = [
// ---------- AULA 1 · TECNOLOGIAS LOGÍSTICAS ----------
{difficulty:"facil", question:"Quantos níveis compõem a pirâmide dos Sistemas de Informação (SIs)?", options:["2","3","4","5"], correct:1, explanation:"Os SIs são organizados em três níveis: Estratégico, Tático e Operacional."},
{difficulty:"facil", question:"Qual sistema está associado ao nível ESTRATÉGICO dos SIs?", options:["SPT","SAD","SAE","SIG"], correct:2, explanation:"O nível estratégico usa os Sistemas de Apoio ao Executivo (SAE), com exemplo em dashboards."},
{difficulty:"medio", question:"O exemplo 'Pagamentos' está associado a qual nível de Sistema de Informação?", options:["Estratégico","Tático","Operacional","Nenhum dos três"], correct:2, explanation:"SPT (Sistemas de Processamento de Transações) atua no nível operacional, com exemplo em pagamentos."},
{difficulty:"dificil", question:"SAD e SIG pertencem a qual nível de Sistema de Informação?", options:["Estratégico","Tático","Operacional","Não fazem parte da pirâmide"], correct:1, explanation:"Sistemas de Apoio à Decisão (SAD) e Sistemas de Informações Gerenciais (SIG) atuam no nível tático, com exemplo em vendas e estoques."},
{difficulty:"facil", question:"Qual das opções abaixo é um exemplo de HARDWARE logístico?", options:["WMS","Roteirizadores","Coletores de dados","EDI"], correct:2, explanation:"Coletores de dados são hardware. WMS, roteirizadores e EDI são exemplos de software logístico."},
{difficulty:"medio", question:"WMS é um exemplo de:", options:["Hardware","Software","Nível estratégico de SI","Tipo de e-commerce"], correct:1, explanation:"WMS, junto com GIS e DRP, é citado como software para logística (geo-localização)."},
{difficulty:"facil", question:"Uma venda direta de uma loja de roupas online para o consumidor final é um exemplo de:", options:["B2B","B2C","C2C","E-procurement"], correct:1, explanation:"B2C é a venda direta da empresa ao consumidor final."},
{difficulty:"facil", question:"A venda entre duas empresas, como uma fábrica vendendo matéria-prima para outra indústria, é:", options:["B2C","B2B","C2C","M-commerce"], correct:1, explanation:"B2B são transações comerciais entre duas empresas."},
{difficulty:"medio", question:"Uma venda no OLX ou Enjoei, intermediada por uma plataforma entre dois consumidores finais, é classificada como:", options:["B2B","B2C","C2C","E-marketplace"], correct:2, explanation:"C2C é o comércio direto entre dois consumidores finais, geralmente intermediado por plataformas digitais."},
{difficulty:"dificil", question:"Qual das opções abaixo NÃO é um problema comum apontado no Comércio Eletrônico (CE)?", options:["Insegurança","Pós-venda","Redução de custos de estoque","Impontualidade"], correct:2, explanation:"Redução de custos de estoque é um benefício do VMI, não um problema do CE. Os problemas do CE incluem inclusão digital, impontualidade, insegurança, pós-venda, indisponibilidade de contato, intangibilidade e identificação incorreta de clientes."},
{difficulty:"medio", question:"O e-procurement é caracterizado por:", options:["Compra e venda entre empresas de suprimentos/serviços via internet","Comércio via televisão interativa","O fornecedor gerenciando o estoque do cliente","Comércio entre dois consumidores finais"], correct:0, explanation:"E-procurement é a compra e venda entre empresas de suprimentos e serviços pela internet, via um site de e-business."},
{difficulty:"facil", question:"O Mercado Livre e o Magalu são citados como exemplos de:", options:["E-procurement","E-marketplace","T-commerce","LBS"], correct:1, explanation:"E-marketplace: portais interativos que unem compradores e vendedores em ambiente neutro."},
{difficulty:"medio", question:"Compras feitas pela televisão interativa via controle remoto (ex: Polishop) são chamadas de:", options:["M-commerce","T-commerce","LBS","E-business"], correct:1, explanation:"T-commerce é o Comércio Eletrônico via televisão interativa."},
{difficulty:"medio", question:"Aplicativos como Uber, Ifood e Pokémon GO, que localizam o consumidor via celular para propor serviços, exemplificam:", options:["M-commerce","LBS","T-commerce","EDI"], correct:1, explanation:"LBS (Location Based Service) permite localizar o consumidor via celular para propor serviços ou produtos."},
{difficulty:"dificil", question:"M-commerce e LBS são a mesma coisa?", options:["Sim, são sinônimos","Não: M-commerce é comércio via dispositivos móveis; LBS é localização via celular para propor serviços","Não: LBS é comércio via TV","Não: M-commerce é exclusivo de bancos"], correct:1, explanation:"M-commerce é o comércio por dispositivos portáteis sem fio; LBS é a comunicação/interação via celular para localizar o consumidor e propor serviços."},
{difficulty:"facil", question:"O CRM tem como foco principal:", options:["Gerenciar o estoque do fornecedor","Centralizar dados e o relacionamento com o cliente","Trocar documentos entre sistemas","Integrar processos financeiros"], correct:1, explanation:"CRM centraliza dados de compras, contatos, históricos de consumo e interações dos consumidores."},
{difficulty:"medio", question:"Qual sistema integra vendas, compras, estoque, PCP, finanças e RH em uma única solução?", options:["CRM","ERP","EDI","VMI"], correct:1, explanation:"ERP é o software de gestão que ajuda a empresa a gerenciar vendas, compras, estoque, PCP, finanças e RH."},
{difficulty:"dificil", question:"A troca automatizada de pedidos de compra e faturas entre sistemas de empresas parceiras, sem intervenção humana, é o:", options:["CRM","ERP","EDI","VMI"], correct:2, explanation:"EDI é o Intercâmbio Eletrônico de Dados: troca automatizada e padronizada de documentos entre sistemas de empresas parceiras."},
{difficulty:"medio", question:"No VMI (Vendor Managed Inventory), quem assume a responsabilidade de reabastecer o estoque?", options:["O cliente","O fornecedor","Uma plataforma neutra","O governo"], correct:1, explanation:"No VMI, o fornecedor assume a responsabilidade de gerenciar e reabastecer o estoque do cliente."},
{difficulty:"dificil", question:"Qual a diferença correta entre E-commerce e E-business?", options:["São sinônimos","E-commerce é só a transação de compra/venda; E-business inclui também aplicações internas e de integração","E-business é menor que o E-commerce","E-business só existe em lojas físicas"], correct:1, explanation:"O CE é a transação eletrônica de compra e venda; o e-business é a evolução que inclui também aplicações internas e de integração (cadeia de fornecimento, relacionamento com cliente, logística)."},

// ---------- AULA 3 · ECOSSISTEMAS DE TI ----------
{difficulty:"facil", question:"Quantos componentes formam o ecossistema de TI empresarial apresentado na Aula 3?", options:["5","6","7","8"], correct:2, explanation:"São sete componentes: Infraestrutura de Dados, Parque Tecnológico, Conectividade, Comunicação, Web e redes sociais, Segurança Patrimonial e Proteção da Informação."},
{difficulty:"facil", question:"Qual das opções é um dos sete componentes do ecossistema de TI?", options:["Segurança Patrimonial","Marketing Digital","Recursos Humanos","Vendas"], correct:0, explanation:"Segurança Patrimonial é um dos sete componentes citados (câmeras, alarmes e acesso)."},
{difficulty:"medio", question:"Um Data Center do tipo 'Enterprise' se caracteriza por:", options:["Ser compartilhado entre várias empresas","Ser construído in loco e usado por uma única empresa","Ser uma instalação gigante focada em nuvem global","Ficar perto dos usuários finais para reduzir latência"], correct:1, explanation:"Enterprise: construídos in loco e usados por uma única empresa."},
{difficulty:"medio", question:"Data centers 'Colocation' são:", options:["Exclusivos de uma empresa","Espaços compartilhados onde várias empresas alugam lugar para seus servidores","Instalações da Google/OpenAI","Locais remotos e pequenos"], correct:1, explanation:"Colocation: espaços compartilhados onde várias empresas alugam lugar para colocar seus próprios servidores."},
{difficulty:"dificil", question:"Um data center do tipo 'Hyperscale' é melhor descrito como:", options:["Um espaço alugado e compartilhado","Um pequeno servidor local de uma única empresa","Instalações gigantescas de empresas globais, focadas em nuvem e grande escala","Um local remoto para reduzir latência"], correct:2, explanation:"Hyperscale: instalações gigantescas de empresas globais (como Google, OpenAI), focadas em nuvem e grande escala."},
{difficulty:"medio", question:"Data centers 'Edge' existem principalmente para:", options:["Reduzir custos de aluguel","Aumentar a distância até o usuário","Reduzir o tempo de resposta da rede, ficando perto dos usuários","Servir exclusivamente uma empresa"], correct:2, explanation:"Edge: locais remotos menores, mais perto dos usuários, para reduzir o tempo de resposta da rede."},
{difficulty:"facil", question:"No sistema de energia de um data center, o que evita quedas de energia?", options:["A refrigeração","Nobreak e gerador","Os servidores","Os switches"], correct:1, explanation:"Nobreaks e geradores são os sistemas de energia que evitam quedas de energia."},
{difficulty:"dificil", question:"No nobreak 'online', de onde sai a energia?", options:["Direto da rede elétrica","Da bateria","Do gerador","Do switch"], correct:1, explanation:"No nobreak online, a energia sai da bateria; no senoidal, a energia sai pura."},
{difficulty:"medio", question:"Qual topologia de rede é apontada como a mais usada atualmente nas empresas?", options:["Anel","Barramento","Estrela","Malha"], correct:2, explanation:"A topologia Estrela é a mais usada nas empresas atualmente, segundo o material."},
{difficulty:"facil", question:"Qual é o padrão de cabeamento de rede citado no material?", options:["HDMI","UTP RJ45","USB-C","Coaxial"], correct:1, explanation:"O cabeamento de rede padrão citado é UTP RJ45."},
{difficulty:"medio", question:"A tecnologia POE (Power over Ethernet) permite:", options:["Transmitir apenas dados pelo cabo","Transmitir apenas energia pelo cabo","Transmitir energia elétrica e dados de rede pelo mesmo cabo","Substituir totalmente o Wi-Fi"], correct:2, explanation:"POE transmite energia elétrica e dados de rede ao mesmo tempo, usando um único cabo de rede."},
{difficulty:"dificil", question:"Qual a diferença entre POE e WIFI segundo o material?", options:["São a mesma tecnologia","POE transmite energia e dados no mesmo cabo; WIFI envia dados via rádio sem fio","WIFI transmite energia; POE transmite som","Nenhuma, ambos usam fibra óptica"], correct:1, explanation:"POE transmite energia e dados no mesmo cabo de rede; WIFI usa tecnologia wireless para enviar dados via rádio entre um Access Point e dispositivos."},
{difficulty:"medio", question:"O endereço IPV4 utiliza quantos bits e permite quantos endereços aproximadamente?", options:["64 bits / quase infinitos endereços","128 bits / 4 bilhões de endereços","32 bits / 4 bilhões de endereços","16 bits / 1 milhão de endereços"], correct:2, explanation:"IPV4 usa 32 bits, permitindo cerca de 4 bilhões de endereços."},
{difficulty:"medio", question:"O IPV6, com 128 bits, oferece:", options:["Menos endereços que o IPV4","A mesma quantidade de endereços do IPV4","Quase infinitas combinações de endereços","Apenas endereços locais"], correct:2, explanation:"IPV6 (128 bits) permite quase infinitas combinações de endereços."},
{difficulty:"facil", question:"O VOIP substituiu principalmente qual tecnologia antiga de telefonia?", options:["Fibra óptica","PABX","Wi-Fi","Bluetooth"], correct:1, explanation:"O material afirma que 'os PABX antigos morreram' com a chegada do VOIP, que faz ligações via internet banda larga."},
{difficulty:"medio", question:"Uma vantagem de ter um SITE PRÓPRIO (loja virtual), segundo o material, é:", options:["Visibilidade alta imediata","Facilidade financeira e logística","Independência e maior lucro, com dados do cliente","Ausência de custo inicial"], correct:2, explanation:"O site próprio oferece independência, lucro maior e dados do cliente; seus desafios são tráfego/visibilidade inicial e custo inicial."},
{difficulty:"medio", question:"Um desafio de vender em um MARKETPLACE, segundo o material, é:", options:["Baixa visibilidade","O cliente pertence à plataforma, além de comissões e concorrência","Falta de tráfego inicial","Alto custo inicial de infraestrutura"], correct:1, explanation:"Os desafios do marketplace são concorrência, comissões e o fato de o cliente pertencer à plataforma."},
{difficulty:"facil", question:"O CFTV é uma solução voltada para:", options:["Proteção da informação","Segurança patrimonial e controle de acessos","Backup de dados","Conectividade de rede"], correct:1, explanation:"O CFTV visa melhorar a segurança patrimonial e o controle de acessos em tempo real."},
{difficulty:"medio", question:"Quantas etapas o material aponta para a adequação de uma empresa à LGPD?", options:["3","4","5","6"], correct:2, explanation:"São 5 etapas: Mapeamento de dados, Bases legais, Direitos dos titulares, Nomeação do DPO e Segurança da informação."},
{difficulty:"dificil", question:"Qual das opções abaixo NÃO é um tipo de backup citado no material?", options:["Local","Rede","Nuvem","Automático"], correct:3, explanation:"Os tipos de backup citados são Local, Rede, Nuvem e Híbrido — 'Automático' não é uma categoria do material."},

// ---------- AULA 4 · INTRODUÇÃO AO EXCEL ----------
{difficulty:"facil", question:"No Excel, um valor digitado como tipo 'Texto' fica alinhado:", options:["À direita","À esquerda","Centralizado","Não é exibido"], correct:1, explanation:"Texto é tratado como palavra e alinhado à esquerda; mesmo digitando números, não é possível fazer contas com eles."},
{difficulty:"facil", question:"Valores digitados como tipo 'Número' ficam alinhados:", options:["À esquerda","À direita","Centralizados","Não aparecem"], correct:1, explanation:"O tipo Número é utilizado para valores e cálculos, e fica alinhado à direita."},
{difficulty:"dificil", question:"Se eu digitar 1250.5 e formatar a célula como Texto, o Excel vai:", options:["Calcular normalmente com esse valor","Exibir 1250,50 alinhado à direita","Manter 1250.5 alinhado à esquerda, sem permitir cálculos","Converter automaticamente para Moeda"], correct:2, explanation:"Como Texto, o exemplo do material mostra 1250.5 alinhado à esquerda, perdendo a função de valor financeiro/numérico."},
{difficulty:"medio", question:"Formatando o valor 1250.5 como Moeda, o resultado exibido é:", options:["1250,50","R$ 1.250,50","1250.5","R$1250"], correct:1, explanation:"Moeda formata valores financeiros, adicionando o símbolo do dinheiro e duas casas decimais: R$ 1.250,50."},
{difficulty:"facil", question:"O endereço de uma célula é formado por:", options:["Número da linha + letra da coluna","Letra da coluna + número da linha","Apenas o número da linha","Apenas a letra da coluna"], correct:1, explanation:"O endereço sempre começa pela letra da coluna seguida do número da linha (ex: A1, C5)."},
{difficulty:"facil", question:"Um salário digitado na coluna C, linha 5, tem o endereço:", options:["5C","C5","C-5","L5C"], correct:1, explanation:"Coluna C + linha 5 = C5."},
{difficulty:"medio", question:"Ao clicar com o botão direito no NÚMERO da linha e escolher 'Inserir', a nova linha aparece:", options:["Abaixo da linha selecionada","Acima da linha selecionada","No lugar da linha selecionada","No final da planilha"], correct:1, explanation:"A nova linha surgirá acima da linha onde foi clicado."},
{difficulty:"medio", question:"Ao clicar com o botão direito na LETRA da coluna e escolher 'Inserir', a nova coluna aparece:", options:["À direita da coluna selecionada","À esquerda da coluna selecionada","Substitui a coluna selecionada","No final da planilha"], correct:1, explanation:"A nova coluna surgirá à esquerda da coluna onde foi clicado."},
{difficulty:"facil", question:"As linhas cinzas visíveis na tela do Excel (linhas de grade) aparecem na impressão por padrão?", options:["Sim, sempre","Não — é preciso aplicar Bordas para aparecerem no papel/PDF","Só em arquivos PDF","Só se a impressora for colorida"], correct:1, explanation:"As linhas de grade são virtuais e, por padrão, não saem na impressão; é preciso aplicar Bordas."},
{difficulty:"medio", question:"Onde fica a opção de 'Bordas' no Excel, segundo o material?", options:["Aba Inserir","Aba Página Inicial > grupo Fonte","Aba Dados","Aba Revisão"], correct:1, explanation:"Bordas fica na aba Página Inicial, dentro do grupo Fonte."},
{difficulty:"facil", question:"A 'alça de preenchimento' é:", options:["Um botão no menu Dados","O pequeno quadrado preto no canto inferior direito da célula selecionada","Um atalho de teclado","Uma fórmula específica"], correct:1, explanation:"A alça de preenchimento é o pequeno quadrado preto no canto inferior direito da célula selecionada."},
{difficulty:"medio", question:"Se eu digitar 'Janeiro' em A1 e arrastar a alça de preenchimento até a linha 12, o Excel:", options:["Repete 'Janeiro' em todas as células","Preenche automaticamente com os meses seguintes até Dezembro","Deixa as células vazias","Gera um erro"], correct:1, explanation:"O Excel reconhece sequências lógicas, como meses, e preenche automaticamente até Dezembro."},
{difficulty:"dificil", question:"Ao clicar em 'Diminuir Casas Decimais', o Excel:", options:["Altera o valor real armazenado no número","Apenas arredonda visualmente a exibição, sem alterar o valor real","Apaga o número da célula","Converte o número em texto"], correct:1, explanation:"Diminuir casas decimais arredonda visualmente o número, mas o valor real permanece o mesmo."},
{difficulty:"facil", question:"Toda fórmula ou função no Excel deve OBRIGATORIAMENTE começar com:", options:["#","@","=","$"], correct:2, explanation:"O sinal de igual (=) avisa ao Excel que ele deve calcular, e não apenas exibir texto."},
{difficulty:"facil", question:"A função =SOMA(A1:A5) serve para:", options:["Calcular a média dos valores de A1 até A5","Somar todos os valores do intervalo A1 até A5","Testar uma condição lógica","Contar quantas células têm valor"], correct:1, explanation:"=SOMA() soma todos os valores de um intervalo de células."},
{difficulty:"medio", question:"A sintaxe correta da função =SE() é:", options:["=SE(valor_se_verdadeiro; teste_lógico; valor_se_falso)","=SE(teste_lógico; valor_se_verdadeiro; valor_se_falso)","=SE(teste_lógico; valor_se_falso; valor_se_verdadeiro)","=SE(célula_inicial:célula_final)"], correct:1, explanation:"A sintaxe é =SE(teste_lógico; valor_se_verdadeiro; valor_se_falso)."},
{difficulty:"medio", question:"Para calcular a média das notas em B1, B2 e B3, a fórmula correta é:", options:["=SOMA(B1:B3)","=MEDIA(B1:B3)","=SE(B1:B3)","=MEDIA(B1+B2+B3)"], correct:1, explanation:"=MEDIA(célula_inicial:célula_final) calcula a média aritmética dos valores no intervalo."},
{difficulty:"medio", question:"A Formatação Condicional serve para:", options:["Calcular automaticamente valores numéricos","Alterar a aparência da célula (cor de fundo/texto) com base em regras definidas","Inserir linhas automaticamente","Salvar o arquivo em outro formato"], correct:1, explanation:"Formatação condicional altera a aparência da célula com base em regras que você define, como saldo negativo em vermelho."},
{difficulty:"dificil", question:"Qual a diferença entre 'Salvar' e 'Salvar Como'?", options:["São exatamente a mesma função","Salvar atualiza o arquivo existente; Salvar Como cria uma nova cópia, podendo mudar nome, pasta ou formato","Salvar Como só funciona para arquivos PDF","Salvar exclui o arquivo original"], correct:1, explanation:"Salvar atualiza as alterações no arquivo atual; Salvar Como cria uma nova cópia, permitindo alterar nome, pasta de destino ou formato."},
{difficulty:"facil", question:"Qual é o atalho de teclado para 'Salvar' indicado no material?", options:["Ctrl + S","Ctrl + B","Ctrl + N","Ctrl + P"], correct:1, explanation:"O material indica SALVAR (CTRL + B) como atalho."}
];

// ===================== ESTADO =====================
let selectedDiff = "todas";
let selectedQty = 15;
let quizSet = [];
let currentIndex = 0;
let score = 0;
let wrongAnswers = [];
let answered = false;

const setupScreen = document.getElementById('setup-screen');
const quizScreen = document.getElementById('quiz-screen');
const resultScreen = document.getElementById('result-screen');

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function poolForDiff(diff) {
  if (diff === "todas") return QUESTIONS;
  return QUESTIONS.filter(q => q.difficulty === diff);
}

function updatePoolInfo() {
  const pool = poolForDiff(selectedDiff);
  document.getElementById('pool-info').textContent =
    "Banco disponível nesse filtro: " + pool.length + " questões (sorteadas de forma diferente a cada partida).";
}
updatePoolInfo();

document.querySelectorAll('#diff-options .opt-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#diff-options .opt-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedDiff = btn.dataset.diff;
    updatePoolInfo();
  });
});

document.querySelectorAll('#qty-options .opt-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#qty-options .opt-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedQty = parseInt(btn.dataset.qty, 10);
  });
});

document.getElementById('start-btn').addEventListener('click', startQuiz);
document.getElementById('next-btn').addEventListener('click', nextQuestion);
document.getElementById('retry-btn').addEventListener('click', () => {
  resultScreen.classList.add('hidden');
  setupScreen.classList.remove('hidden');
});
document.getElementById('review-toggle').addEventListener('click', () => {
  const list = document.getElementById('review-list');
  list.classList.toggle('hidden');
  document.getElementById('review-toggle').textContent = list.classList.contains('hidden')
    ? "Ver revisão das questões erradas"
    : "Ocultar revisão";
});

function startQuiz() {
  const pool = shuffle(poolForDiff(selectedDiff));
  const n = Math.min(selectedQty, pool.length);
  quizSet = pool.slice(0, n).map(q => {
    // embaralha também a ordem das alternativas
    const optWithIndex = q.options.map((opt, idx) => ({opt, idx}));
    const shuffledOpts = shuffle(optWithIndex);
    return {
      ...q,
      shuffledOptions: shuffledOpts.map(o => o.opt),
      correctShuffledIndex: shuffledOpts.findIndex(o => o.idx === q.correct)
    };
  });
  currentIndex = 0;
  score = 0;
  wrongAnswers = [];
  setupScreen.classList.add('hidden');
  resultScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = quizSet[currentIndex];
  document.getElementById('progress-text').textContent = "Questão " + (currentIndex + 1) + " de " + quizSet.length;
  document.getElementById('score-text').textContent = "Acertos: " + score;
  document.getElementById('progress-fill').style.width = ((currentIndex) / quizSet.length * 100) + "%";

  const chip = document.getElementById('diff-chip');
  chip.className = "diff-chip diff-" + q.difficulty;
  chip.textContent = q.difficulty === "facil" ? "fácil" : q.difficulty;

  document.getElementById('question-text').textContent = q.question;

  const container = document.getElementById('answers-container');
  container.innerHTML = "";
  q.shuffledOptions.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = "answer-btn";
    btn.textContent = opt;
    btn.addEventListener('click', () => selectAnswer(idx));
    container.appendChild(btn);
  });

  document.getElementById('feedback-box').classList.add('hidden');
  document.getElementById('next-btn').classList.add('hidden');
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = quizSet[currentIndex];
  const buttons = document.querySelectorAll('#answers-container .answer-btn');
  buttons.forEach(b => b.disabled = true);

  const isCorrect = idx === q.correctShuffledIndex;
  buttons[q.correctShuffledIndex].classList.add('correct');
  if (!isCorrect) {
    buttons[idx].classList.add('wrong');
    wrongAnswers.push({
      question: q.question,
      yourAnswer: q.shuffledOptions[idx],
      correctAnswer: q.shuffledOptions[q.correctShuffledIndex],
      explanation: q.explanation
    });
  } else {
    score++;
  }

  const fb = document.getElementById('feedback-box');
  fb.classList.remove('hidden', 'ok', 'no');
  fb.classList.add(isCorrect ? 'ok' : 'no');
  fb.innerHTML = '<div class="feedback-title">' + (isCorrect ? "✅ Isso aí, mandou bem!" : "❌ Quase — não foi essa dessa vez.") + '</div>' + q.explanation;

  document.getElementById('score-text').textContent = "Acertos: " + score;
  document.getElementById('next-btn').classList.remove('hidden');
  document.getElementById('next-btn').textContent = (currentIndex === quizSet.length - 1) ? "Ver resultado 🏁" : "Próxima pergunta →";
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= quizSet.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult() {
  quizScreen.classList.add('hidden');
  resultScreen.classList.remove('hidden');
  document.getElementById('progress-fill').style.width = "100%";

  document.getElementById('final-score').textContent = score + "/" + quizSet.length;
  const pct = Math.round((score / quizSet.length) * 100);
  document.getElementById('final-pct').textContent = pct + "% de aproveitamento";

  const list = document.getElementById('review-list');
  list.classList.add('hidden');
  document.getElementById('review-toggle').textContent = "Ver revisão das questões erradas";

  if (wrongAnswers.length === 0) {
    list.innerHTML = "<p style='color:var(--muted); text-align:center;'>Você não errou nenhuma questão dessa vez! 🎉</p>";
  } else {
    list.innerHTML = wrongAnswers.map(w => `
      <div class="review-item">
        <p class="review-q">${w.question}</p>
        <p class="review-line">Sua resposta: <span class="tag-no">${w.yourAnswer}</span></p>
        <p class="review-line">Resposta certa: <span class="tag-ok">${w.correctAnswer}</span></p>
        <p class="review-line" style="color:var(--muted);">${w.explanation}</p>
      </div>
    `).join("");
  }
}
</script>
</body>
</html>
